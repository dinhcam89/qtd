name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Check, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint code & formatting
        run: npm run lint

      - name: Astro type & schema check
        run: npm run check

      - name: Check WCAG color contrast
        run: npm run check:contrast

      - name: Build static site
        run: npm run build

      - name: Verify dist integrity
        run: npm run check:dist

      - name: Install Playwright browsers & system deps
        run: npx playwright install --with-deps chromium

      - name: Scan content placeholders (advisory)
        run: npm run check:placeholders

      - name: Run automated test suite (Playwright + Axe)
        run: npm test

      - name: Run fixture tests
        run: npm run test:fixtures

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Install Playwright browsers & system deps
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse CI (full)
        run: npm run lhci
