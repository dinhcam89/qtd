description: 'QTDND Vạn Trạch tiền thân là Hợp tác xã tín dụng được thành lập từ năm 1958. Đến năm 1996, đơn vị chuyển sang mô hình hoạt động QTDND phù hợp với định hướng đổi mới của Nhà nước và xu thế phát triển tài chính hợp tác. Kể từ đó, Quỹ từng bước củng cố hoạt động, mở rộng quy mô, không ngừng nâng cao chất lượng dịch vụ, khẳng định uy tín trên địa bàn.'
